[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-zero-trust-auditor"
version = "0.1.0"
description = "Audits Istio/Envoy service mesh policies, Tailscale/WireGuard ACLs, BeyondCorp access proxies, and mTLS configurations for permissive PERMISSIVE mTLS modes, missing device posture checks, and lateral movement paths."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "zero-trust",
    "ztna",
    "mtls",
    "istio-security",
    "service-mesh",
    "microsegmentation",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-zero-trust-auditor"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-zero-trust-auditor"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-zero-trust-auditor#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-zero-trust-auditor/issues"

[project.scripts]
lh-ztna = "lh_zero_trust_auditor.cli:app"
lh-zero-trust-auditor = "lh_zero_trust_auditor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_zero_trust_auditor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

